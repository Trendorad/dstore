<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجري</title>

<style>
body{
    margin:0;
    font-family:Tahoma;
    background:#111;
    color:white;
    text-align:center;
}

header{
    background:#ff9800;
    padding:20px;
    font-size:30px;
    font-weight:bold;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:20px;
}

.card{
    background:#222;
    width:250px;
    margin:15px;
    padding:15px;
    border-radius:15px;
}

.card img{
    width:100%;
    border-radius:10px;
}

button{
    background:#ff9800;
    border:none;
    padding:10px 20px;
    color:white;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
متجري الإلكتروني
</header>

<h2>أحدث المنتجات</h2>

<div class="products">

<div class="card">
<img src="https://via.placeholder.com/250">
<h3>منتج رقم 1</h3>
<p>سعر المنتج: 100 جنيه</p>
<button>شراء الآن</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/250">
<h3>منتج رقم 2</h3>
<p>سعر المنتج: 200 جنيه</p>
<button>شراء الآن</button>
</div>

</div>

</body>
</html>
