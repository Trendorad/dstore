<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trendora Electronics</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

</head>

<body>

<header>

  <div class="logo">
    Trendora Electronics
  </div>

  <nav>

    <a href="#">الرئيسية</a>
    <a href="#products">المنتجات</a>

  </nav>

  <button onclick="viewCart()" class="cart-btn">
    🛒 السلة
  </button>

</header>

<section class="hero">

  <div class="hero-content">

    <h1>
      أحدث الإلكترونيات
    </h1>

    <p>
      متجر إلكترونيات احترافي
    </p>

    <button onclick="register()" class="hero-btn">
      إنشاء حساب
    </button>

    <button onclick="login()" class="hero-btn">
      تسجيل الدخول
    </button>

  </div>

</section>

<section class="products" id="products">

  <h2 class="section-title">
    المنتجات
  </h2>

  <div class="product-grid">

    <div class="card">

      <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1200&auto=format&fit=crop">

      <div class="card-body">

        <h3>iPhone 15 Pro</h3>

        <div class="price">
          45000 جنيه
        </div>

        <button
        class="buy-btn"
        onclick="addToCart('iPhone 15 Pro','45000')">

          إضافة للسلة

        </button>

      </div>

    </div>

  </div>

</section>

<div class="payment-modal" id="paymentModal">

  <div class="payment-box">

    <h2>
      إتمام الطلب
    </h2>

    <p id="productName"></p>

    <p id="productPrice"></p>

    <input type="text"
    id="customerName"
    placeholder="الاسم">

    <input type="text"
    id="customerAddress"
    placeholder="العنوان">

    <select id="paymentMethod">

      <option value="cash">
        الدفع عند الاستلام
      </option>

      <option value="etisalat">
        اتصالات كاش
      </option>

    </select>

    <button
    class="confirm-btn"
    onclick="confirmOrder()">

      تأكيد الطلب

    </button>

  </div>

</div>

<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
    </html>
