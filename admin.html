<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>

<style>
body{
    font-family:Tahoma;
    background:#111;
    color:white;
    margin:0;
    padding:0;
}

header{
    background:#ff9800;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:18px;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#ff9800;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.card{
    background:#222;
    padding:15px;
    margin-top:20px;
    border-radius:15px;
}

img{
    width:100%;
    border-radius:10px;
}

.delete{
    background:red;
}
</style>
</head>

<body>

<header>
لوحة تحكم المتجر
</header>

<div class="container">

<input type="password" id="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>

<div id="adminPanel" style="display:none;">

<input type="text" id="name" placeholder="اسم المنتج">

<input type="text" id="price" placeholder="سعر المنتج">

<input type="text" id="image" placeholder="رابط صورة المنتج">

<button onclick="addProduct()">إضافة المنتج</button>

<div id="products"></div>

</div>

</div>

<script>

const adminPassword = "diaa2011";

function login(){

let pass = document.getElementById("password").value;

if(pass === adminPassword){

document.getElementById("adminPanel").style.display = "block";

alert("تم تسجيل الدخول");

}else{

alert("كلمة المرور خطأ");

}

}

let products = JSON.parse(localStorage.getItem("products")) || [];

function saveProducts(){

localStorage.setItem("products", JSON.stringify(products));

showProducts();

}

function addProduct(){

let name = document.getElementById("name").value;

let price = document.getElementById("price").value;

let image = document.getElementById("image").value;

products.push({
name,
price,
image
});

saveProducts();

document.getElementById("name").value = "";
document.getElementById("price").value = "";
document.getElementById("image").value = "";

}

function deleteProduct(index){

products.splice(index,1);

saveProducts();

}

function showProducts(){

let box = document.getElementById("products");

box.innerHTML = "";

products.forEach((product,index)=>{

box.innerHTML += `

<div class="card">

<img src="${product.image}">

<h2>${product.name}</h2>

<p>${product.price} جنيه</p>

<button class="delete" onclick="deleteProduct(${index})">حذف</button>

</div>

`;

});

}

showProducts();

</script>

</body>
  </html>
