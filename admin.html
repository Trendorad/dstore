<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الأدمن</title>

<style>
body{
    font-family: Arial;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    background:#1e1e1e;
    padding:30px;
    border-radius:15px;
    width:300px;
    text-align:center;
    box-shadow:0 0 20px #000;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#00b894;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#019870;
}

#panel{
    display:none;
}

.card{
    background:#2c2c2c;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}
</style>

</head>
<body>

<div class="box">

<div id="login">

<h2>تسجيل دخول الأدمن</h2>

<input type="password" id="password" placeholder="ادخل كلمة المرور">

<button onclick="login()">دخول</button>

<p id="msg"></p>

</div>

<div id="panel">

<h2>مرحباً بك في لوحة الأدمن</h2>

<div class="card">
<p>اسم المتجر: Trendorad</p>
</div>

<div class="card">
<p>الحالة: يعمل بنجاح ✅</p>
</div>

<button onclick="logout()">تسجيل خروج</button>

</div>

</div>

<script>

const adminPassword = "diaa2011";

function login(){

    const pass = document.getElementById("password").value;

    if(pass === adminPassword){

        document.getElementById("login").style.display = "none";
        document.getElementById("panel").style.display = "block";

    }else{

        document.getElementById("msg").innerHTML = "كلمة المرور غير صحيحة";

    }

}

function logout(){

    document.getElementById("panel").style.display = "none";
    document.getElementById("login").style.display = "block";

}

</script>

</body>
</html>
