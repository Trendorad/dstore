<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة التحكم</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>

form{
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
max-width:400px;
margin:auto;
}

input{
padding:12px;
border:none;
border-radius:10px;
}

button{
padding:12px;
border:none;
background:#3b82f6;
color:white;
border-radius:10px;
cursor:pointer;
}

.admin-products{
padding:30px;
}

.item{
background:#1e293b;
padding:20px;
margin-bottom:15px;
border-radius:10px;
}

.delete-btn{
background:red;
padding:10px;
display:inline-block;
margin-top:10px;
text-decoration:none;
color:white;
border-radius:10px;
}

</style>

</head>

<body>

<h1 style="text-align:center;padding:20px;">
لوحة تحكم D STORE
</h1>

<form method="POST" action="/add-product">

<input type="text" name="name" placeholder="اسم المنتج" required>

<input type="text" name="price" placeholder="السعر" required>

<input type="text" name="image" placeholder="رابط الصورة" required>

<button type="submit">
إضافة المنتج
</button>

</form>

<div class="admin-products">

{% for product in products %}

<div class="item">

<h2>{{ product.name }}</h2>

<p>{{ product.price }} جنيه</p>

<a class="delete-btn" href="/delete-product/{{ loop.index0 }}">
حذف المنتج
</a>

</div>

{% endfor %}

</div>

</body>

</html>
